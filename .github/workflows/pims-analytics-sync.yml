name: PiMS Analytics Sync

on:
  repository_dispatch:
    types: [pims-analytics-sync]

permissions:
  contents: write

concurrency:
  group: pims-analytics-sync
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download the website repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate and save the analytics
        shell: python
        run: |
          import json
          import math
          import os
          from datetime import datetime
          from pathlib import Path

          event = json.loads(
              Path(os.environ["GITHUB_EVENT_PATH"]).read_text()
          )
          payload = event["client_payload"]

          if not isinstance(payload, dict):
              raise ValueError("Expected a JSON object as the event payload.")

          qty = payload.get("totalPoQty")
          exported_at = payload.get("exportedAtUtc")

          if (
              type(qty) not in (int, float)
              or not math.isfinite(qty)
              or qty < 0
          ):
              raise ValueError("totalPoQty must be a valid non-negative number.")

          if not isinstance(exported_at, str):
              raise ValueError("exportedAtUtc must be a timestamp.")

          timestamp = datetime.fromisoformat(
              exported_at.replace("Z", "+00:00")
          )
          if timestamp.tzinfo is None:
              raise ValueError("The timestamp must include a time zone.")

          output = Path("data/analytics.json")
          output.parent.mkdir(parents=True, exist_ok=True)

          if output.exists():
              previous = json.loads(output.read_text())
              previous_time = datetime.fromisoformat(
                  previous["exportedAtUtc"].replace("Z", "+00:00")
              )
              if timestamp <= previous_time:
                  print("Skipping an older or duplicate export.")
                  raise SystemExit(0)

          data = {
              "totalPoQty": qty,
              "exportedAtUtc": exported_at
          }

          output.write_text(
              json.dumps(data, indent=2, allow_nan=False) + "\n"
          )

      - name: Save the updated data to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/analytics.json

          if git diff --cached --quiet; then
            echo "No data changes to save."
            exit 0
          fi

          git commit -m "Update PiMS dashboard analytics"
          git push origin HEAD:main

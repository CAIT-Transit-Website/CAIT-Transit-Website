name: PiMS Analytics Sync

on:
  repository_dispatch:
    types: [pims-analytics-sync]

permissions:
  contents: write

concurrency:
  group: pims-analytics-sync
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download the website repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate and save the analytics
        run: python .github/scripts/validate_inventory.py

      - name: Save the updated data to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/analytics.json

          if git diff --cached --quiet; then
            echo "No data changes to save."
            exit 0
          fi

          git commit -m "Update PiMS dashboard analytics"
          git push origin HEAD:main
